name: ComboShip Android native port
on:
  push:
    branches: [comboship-android-2026-09-25]
    paths: ['ComboAndroid/**', '.github/workflows/comboship-android.yml']
permissions:
  contents: read
concurrency:
  group: comboship-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sdk-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            ComboAndroid
            .github
      - uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: release-2.32.10
          path: sdl-reference
          persist-credentials: false
          sparse-checkout: android-project/app/src/main/java
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Run ROM import, locking, input, and path unit tests
        shell: bash
        run: |
          set -euo pipefail
          bash ComboAndroid/tools/run_tests.sh 2>&1 | tee unit-tests.log
      - name: Compile Android resources and all Java against the SDK without making an APK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" </dev/null
          mkdir -p ComboAndroid/app/src/main/sdl-java
          cp -a sdl-reference/android-project/app/src/main/java/. ComboAndroid/app/src/main/sdl-java/
          gradle -p ComboAndroid :app:compileDebugJavaWithJavac -x :app:verifyRuntime --no-daemon --stacktrace 2>&1 | tee android-java-compile.log
      - name: Preserve SDK and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comboship-android-sdk-tests
          path: |
            unit-tests.log
            android-java-compile.log
            ComboAndroid/build/host-tests/Testing/Temporary/LastTest.log
          retention-days: 7
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      ANDROID_NDK_VERSION: 28.2.13676358
      CCACHE_DIR: ${{ github.workspace }}/.ccache-combo
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            ComboAndroid
            .github
      - uses: actions/checkout@v4
        with:
          repository: Varuuna/ComboShip
          ref: 94eb185e4abcc2d568aa8241fa02c43cdd86c439
          path: upstream
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 10541e317a660f4165ba4ac2851ab54a8d4577b1
          path: vcpkg
          persist-credentials: false
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Install host dependencies and Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache autoconf automake libtool pkg-config libusb-dev libusb-1.0-0-dev libsdl2-dev libsdl2-net-dev libpng-dev libglew-dev nlohmann-json3-dev libtinyxml2-dev libspdlog-dev libogg-dev libopus-dev opus-tools libopusfile-dev libvorbis-dev libzip-dev zipcmp zipmerge ziptool
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ANDROID_NDK_VERSION" "platforms;android-35" "build-tools;35.0.0" </dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        id: buildcache
        with:
          path: |
            ~/.cache/vcpkg/archives
            .ccache-combo
          key: combo-arm64-ndk28-v1-${{ github.sha }}
          restore-keys: combo-arm64-ndk28-v1-
      - name: Retain development signing identity across CI builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: comboship-android-development-signing-v1
      - name: Compile native games, generate no-ROM support data, and assemble APK
        shell: bash
        run: |
          set -euo pipefail
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          bash ComboAndroid/tools/build.sh "$GITHUB_WORKSPACE/upstream" "$GITHUB_WORKSPACE/vcpkg" "$GITHUB_WORKSPACE"
      - name: Preserve completed dependency and compiler work even after failure
        if: always() && steps.buildcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            .ccache-combo
          key: combo-arm64-ndk28-v1-${{ github.sha }}
      - name: Archive exact port source for reproducibility
        if: always()
        shell: bash
        run: |
          tar --exclude=build --exclude=.gradle --exclude=.cxx --exclude=__pycache__ --exclude=assets --exclude=jniLibs --exclude=sdl-java -czf comboship-android-port-source.tar.gz ComboAndroid .github/workflows/comboship-android.yml
      - name: Preserve diagnostics and source provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comboship-android-native-diagnostics
          path: |
            android-configure.log
            android-build.log
            android-package.log
            assets-configure.log
            assets-build.log
            comboship-android-port-source.tar.gz
            upstream/.comboship-android-patched.json
            build-android/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 7
      - name: Upload APK only after the full real-runtime build and checks pass
        uses: actions/upload-artifact@v4
        with:
          name: comboship-android-apk-arm64
          path: apk-output
          if-no-files-found: error
          retention-days: 14
