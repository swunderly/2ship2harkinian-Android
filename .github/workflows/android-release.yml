name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - android
    paths:
      - "Android/**"
      - "CMake/**"
      - "CMakeLists.txt"
      - "OTRExporter/**"
      - "ZAPDTR/**"
      - "libultraship/**"
      - "mm/**"
      - ".github/workflows/android-release.yml"

jobs:
  generate-2ship-otr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch pinned submodule sources
        run: |
          rm -rf libultraship OTRExporter ZAPDTR
          mkdir -p libultraship OTRExporter ZAPDTR
          curl -L --retry 3 -o /tmp/libultraship.tar.gz https://github.com/linkzenic/libultraship/archive/88260169230b9c6e44bd46a1c6b98c5a3c44b358.tar.gz
          curl -L --retry 3 -o /tmp/OTRExporter.tar.gz https://github.com/Waterdish/OTRExporter/archive/1cbb1b65dd4646a964f8ded921af7c7249e4433c.tar.gz
          curl -L --retry 3 -o /tmp/ZAPDTR.tar.gz https://github.com/Waterdish/ZAPDTR/archive/24ca939d543bccc4869064d84dcae85495ecd583.tar.gz
          tar -xzf /tmp/libultraship.tar.gz --strip-components=1 -C libultraship
          tar -xzf /tmp/OTRExporter.tar.gz --strip-components=1 -C OTRExporter
          tar -xzf /tmp/ZAPDTR.tar.gz --strip-components=1 -C ZAPDTR

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat .github/workflows/apt-deps.txt) libzip-dev zipcmp zipmerge ziptool file

      - name: Install latest SDL
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          if [ ! -d "SDL2-2.28.5" ]; then
            wget https://github.com/libsdl-org/SDL/releases/download/release-2.28.5/SDL2-2.28.5.tar.gz
            tar -xzf SDL2-2.28.5.tar.gz
          fi
          cd SDL2-2.28.5
          ./configure --enable-hidapi-libusb
          make -j 10
          sudo make install
          sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/

      - name: Install latest tinyxml2
        run: |
          sudo apt-get remove -y libtinyxml2-dev
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          if [ ! -d "tinyxml2-10.0.0" ]; then
            wget https://github.com/leethomason/tinyxml2/archive/refs/tags/10.0.0.tar.gz
            tar -xzf 10.0.0.tar.gz
          fi
          cd tinyxml2-10.0.0
          mkdir -p build
          cd build
          cmake ..
          make
          sudo make install

      - name: Generate no-ROM support archive
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release
          cmake --build build-cmake --config Release --target Generate2ShipOtr -j3

      - uses: actions/upload-artifact@v4
        with:
          name: 2ship.o2r
          path: 2ship.o2r
          retention-days: 7

      - name: Prepare checked-out source artifact
        run: |
          tar --exclude-vcs --exclude=build-cmake --exclude=SDL2-2.28.5 --exclude=tinyxml2-10.0.0 -czf /tmp/source-checkout.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: source-checkout
          path: /tmp/source-checkout.tar.gz
          retention-days: 7

  build-android:
    needs: generate-2ship-otr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source-checkout

      - name: Restore checked-out source
        run: tar -xzf source-checkout.tar.gz

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.0.10792818" "cmake;3.30.3"

      - uses: actions/download-artifact@v4
        with:
          name: 2ship.o2r
          path: Android/app/src/main/assets

      - name: Build release APK
        working-directory: Android
        run: ./gradlew :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: Android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
